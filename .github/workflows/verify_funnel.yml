name: Verify per-asset prediction funnel (one-off)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch BTC, LINK, and SOL responses and commit for inspection
        run: |
          curl -s "${{ secrets.V4_WORKER_URL }}/api/assets/BTC/prediction-funnel?model=knn&horizon=24" -o /tmp/btc.json
          curl -s "${{ secrets.V4_WORKER_URL }}/api/assets/LINK/prediction-funnel?model=timesfm&horizon=24" -o /tmp/link_timesfm.json
          curl -s "${{ secrets.V4_WORKER_URL }}/api/assets/SOL/prediction-funnel?model=knn&horizon=24" -o /tmp/sol.json
          python3 -m json.tool /tmp/btc.json > .github/verify-btc.json || cp /tmp/btc.json .github/verify-btc.json
          python3 -m json.tool /tmp/link_timesfm.json > .github/verify-link-timesfm.json || cp /tmp/link_timesfm.json .github/verify-link-timesfm.json
          python3 -m json.tool /tmp/sol.json > .github/verify-sol.json || cp /tmp/sol.json .github/verify-sol.json
          git config user.email "ci@cryptopulse.local"
          git config user.name "CI Verification"
          git add .github/verify-btc.json .github/verify-link-timesfm.json .github/verify-sol.json
          git commit -m "chore: capture live per-asset funnel responses for inspection" || echo "nothing to commit"
          git push
