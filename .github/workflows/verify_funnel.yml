name: Verify prediction funnel (one-off)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch both model responses and commit them for inspection
        run: |
          curl -s "${{ secrets.V4_WORKER_URL }}/api/portfolio/prediction-funnel?model=knn&horizon=24" -o /tmp/knn.json
          curl -s "${{ secrets.V4_WORKER_URL }}/api/portfolio/prediction-funnel?model=timesfm&horizon=24" -o /tmp/timesfm.json
          mkdir -p /tmp/verify-out
          python3 -m json.tool /tmp/knn.json > /tmp/verify-out/knn.json || cp /tmp/knn.json /tmp/verify-out/knn.json
          python3 -m json.tool /tmp/timesfm.json > /tmp/verify-out/timesfm.json || cp /tmp/timesfm.json /tmp/verify-out/timesfm.json
          cp /tmp/verify-out/knn.json .github/verify-knn-response.json
          cp /tmp/verify-out/timesfm.json .github/verify-timesfm-response.json
          git config user.email "ci@cryptopulse.local"
          git config user.name "CI Verification"
          git add .github/verify-knn-response.json .github/verify-timesfm-response.json
          git commit -m "chore: capture live prediction-funnel response for inspection" || echo "nothing to commit"
          git push
