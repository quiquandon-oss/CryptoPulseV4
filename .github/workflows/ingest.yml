name: V4 ingest tick

on:
  # SUSPENDED 2026-11-17 (owner decision): the hourly schedule is removed so V4 does not consume the account's shared
  # Workers Free D1 allowance (V4 reads production sentiment-history and writes its own cryptopulse-v4 database each
  # run). Manual runs stay available. To resume, restore:
  #   schedule:
  #     - cron: '5 * * * *'
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Call V4 ingest endpoint
        run: |
          status=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -X POST "${{ secrets.V4_WORKER_URL }}/api/ingest" \
            -H "Authorization: Bearer ${{ secrets.V4_INGEST_TOKEN }}")
          cat /tmp/resp.json
          if [ "$status" -ge 300 ]; then
            echo "Ingest call failed with HTTP $status"
            exit 1
          fi
