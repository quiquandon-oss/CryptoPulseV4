name: V4 portfolio backfill (one-off)

on:
  workflow_dispatch: {}

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Call V4 backfill endpoint
        run: |
          status=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            --max-time 120 \
            -X POST "${{ secrets.V4_WORKER_URL }}/api/portfolio/backfill" \
            -H "Authorization: Bearer ${{ secrets.V4_INGEST_TOKEN }}")
          cat /tmp/resp.json
          if [ "$status" -ge 300 ]; then
            echo "Backfill call failed with HTTP $status"
            exit 1
          fi
