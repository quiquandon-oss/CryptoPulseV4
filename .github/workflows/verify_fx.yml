name: Verify FX endpoint (one-off)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch EUR/USD rate twice (second call should be from cache)
        run: |
          curl -s "${{ secrets.V4_WORKER_URL }}/api/fx/eur-usd" -o /tmp/fx1.json
          curl -s "${{ secrets.V4_WORKER_URL }}/api/fx/eur-usd" -o /tmp/fx2.json
          python3 -m json.tool /tmp/fx1.json > .github/verify-fx1.json
          python3 -m json.tool /tmp/fx2.json > .github/verify-fx2.json
          git config user.email "ci@cryptopulse.local"
          git config user.name "CI Verification"
          git add .github/verify-fx1.json .github/verify-fx2.json
          git commit -m "chore: capture live FX endpoint responses" || echo "nothing to commit"
          git push
