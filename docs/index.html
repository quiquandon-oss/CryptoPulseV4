<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CryptoPulse V4 — Terminal</title>
<script>
  (function () {
    var saved = localStorage.getItem('v4-theme');
    var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="theme.css?v=4.0.1" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['"IBM Plex Mono"', 'monospace'] } } },
  };
</script>
</head>
<body class="bg-base text-ink font-sans min-h-screen">
<div class="max-w-3xl mx-auto px-4 sm:px-6 py-8">

  <header class="flex items-start justify-between mb-4 pb-4 border-b border-border">
    <div>
      <h1 class="font-mono font-semibold text-lg tracking-tight">CryptoPulse V4</h1>
      <p class="text-xs text-faint mt-0.5">Deterministic evidence, not hype.</p>
    </div>
    <div class="flex items-center gap-3">
      <div class="text-right">
        <div id="marketStatus" class="flex items-center justify-end gap-2 text-sm font-mono">
          <span class="w-2 h-2 rounded-full bg-unavailable" id="statusDot"></span>
          <span id="statusLabel">Loading…</span>
        </div>
        <p class="text-xs text-faint mt-0.5" id="lastUpdate"></p>
      </div>
      <button class="theme-toggle" aria-label="Toggle theme" title="Toggle light/dark theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
      </button>
    </div>
  </header>

  <nav id="siteNav" class="flex items-center gap-1 mb-6 overflow-x-auto"></nav>

  <section class="mb-6">
    <div class="flex items-center justify-between mb-2">
      <h2 class="text-xs text-faint">My Assets</h2>
      <a href="portfolio.html" class="text-xs text-accent hover-text-muted">View all &rarr;</a>
    </div>
    <a href="portfolio.html" id="portfolioTeaser" class="block border border-border rounded-lg p-4 hover-bg-surface transition-colors">
      <p class="text-sm text-faint">Loading…</p>
    </a>
  </section>

  <section class="mb-6">
    <h2 class="text-xs text-faint mb-2">Market overview</h2>
    <div id="overview" class="border border-border rounded-lg divide-y divide-border overflow-hidden">
      <div class="px-4 py-6 text-sm text-faint">Loading signals…</div>
    </div>
  </section>

  <footer class="flex items-center justify-between text-xs text-faint mt-8">
    <span>CryptoPulse V4</span>
    <span>Independent of V1/V2/V3</span>
  </footer>
</div>

<script src="app.js?v=4.0.1"></script>
<script>
renderNav('index.html');
(async function () {
  const el = {
    overview: document.getElementById('overview'),
    statusDot: document.getElementById('statusDot'),
    statusLabel: document.getElementById('statusLabel'),
    lastUpdate: document.getElementById('lastUpdate'),
  };

  function riskBadge(risk) {
    const color = risk === 'LOW' ? 'text-up' : risk === 'HIGH' ? 'text-down' : 'text-warn';
    return `<span class="${color} font-mono text-xs">${risk}</span>`;
  }

  function row(item) {
    if (!item.signal) {
      return `<a href="asset.html?asset=${item.asset}" class="flex items-center justify-between px-4 py-4 hover-bg-surface transition-colors">
        <span class="font-mono font-medium">${item.asset}</span>
        <span class="text-sm text-faint">Collecting evidence — no signal yet</span>
      </a>`;
    }
    const s = item.signal;
    const dirColor = s.direction === 'BULLISH' ? 'text-up' : s.direction === 'BEARISH' ? 'text-down' : 'text-muted';
    return `<a href="asset.html?asset=${item.asset}" class="flex items-center justify-between px-4 py-4 hover-bg-surface transition-colors gap-4">
      <div class="flex items-baseline gap-3 min-w-0">
        <span class="font-mono font-medium w-12 shrink-0">${item.asset}</span>
        <span class="${dirColor} font-mono text-sm shrink-0">${s.direction} ${s.score >= 0 ? '+' : ''}${s.score}</span>
        <span class="text-xs text-faint truncate hidden sm:inline">${s.evidenceLabel}</span>
      </div>
      <div class="flex items-center gap-4 shrink-0">
        <span class="text-xs text-muted font-mono hidden sm:inline">${s.regime.replaceAll('_', ' ')}</span>
        ${riskBadge(s.risk)}
      </div>
    </a>`;
  }

  try {
    const [{ overview }, health] = await Promise.all([
      v4Fetch('/api/market/overview'),
      v4Fetch('/api/health'),
    ]);

    el.overview.innerHTML = overview.map(row).join('') || '<div class="px-4 py-6 text-sm text-faint">No assets configured.</div>';

    el.statusDot.className = `w-2 h-2 rounded-full ${health.overall === 'LIVE' ? 'bg-up' : health.overall === 'DEGRADED' ? 'bg-recent' : 'bg-unavailable'}`;
    el.statusLabel.textContent = health.overall;
    el.lastUpdate.textContent = `Checked ${new Date().toLocaleTimeString()}`;
  } catch (err) {
    el.overview.innerHTML = `<div class="px-4 py-6 text-sm text-down">Could not reach the V4 API. ${escapeHtml(err.message)}</div>`;
    el.statusLabel.textContent = 'OFFLINE';
    el.statusDot.className = 'w-2 h-2 rounded-full bg-unavailable';
  }

  try {
    const s = await v4Fetch('/api/portfolio');
    const teaser = document.getElementById('portfolioTeaser');
    if (!s.hasData) {
      teaser.innerHTML = '<p class="text-sm text-faint">No portfolio imported yet — tap to add your Neverless/Revolut statements.</p>';
    } else {
      const pnlColor = s.unrealizedPnl == null ? 'text-faint' : s.unrealizedPnl >= 0 ? 'text-up' : 'text-down';
      teaser.innerHTML = `<div class="flex items-center justify-between">
        <span class="font-mono text-lg">${s.totalValue != null ? fmtUsd(s.totalValue) : '—'}</span>
        <span class="font-mono text-sm ${pnlColor}">${s.unrealizedPnlPct != null ? fmtPct(s.unrealizedPnlPct) : '—'}</span>
      </div>`;
    }
  } catch {
    document.getElementById('portfolioTeaser').innerHTML = '<p class="text-sm text-faint">Portfolio unavailable.</p>';
  }
})();
</script>
</body>
</html>
