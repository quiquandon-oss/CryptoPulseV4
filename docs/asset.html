<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CryptoPulse V4 — Asset Detail</title>
<script>
  (function () {
    var saved = localStorage.getItem('v4-theme');
    var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="theme.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['"IBM Plex Mono"', 'monospace'] } } } };
</script>
</head>
<body class="bg-base text-ink font-sans min-h-screen">
<div class="max-w-3xl mx-auto px-4 sm:px-6 py-8">

  <div class="flex items-center justify-between mb-3">
    <a href="index.html" class="text-xs text-faint hover-text-muted">&larr; Market overview</a>
    <button class="theme-toggle" aria-label="Toggle theme" title="Toggle light/dark theme">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
    </button>
  </div>

  <nav id="siteNav" class="flex items-center gap-1 mb-4 overflow-x-auto"></nav>

  <header class="mb-6 pb-4 border-b border-border">
    <h1 id="assetTitle" class="font-mono font-semibold text-xl">—</h1>
    <p id="assetPrice" class="text-sm text-muted mt-1"></p>
  </header>

  <section id="signalSection" class="mb-6 border border-border rounded-lg p-4">
    <p class="text-sm text-faint">Loading signal…</p>
  </section>

  <section class="mb-6">
    <div class="flex items-center justify-between mb-2">
      <h2 class="text-xs text-faint">Signal timeline &amp; price</h2>
      <div id="rangeButtons" class="flex gap-1"></div>
    </div>
    <div id="chartContainer" class="border border-border rounded-lg p-3">
      <div class="px-4 py-10 text-center text-sm text-faint">Loading chart…</div>
    </div>
  </section>

  <section class="mb-6">
    <h2 class="text-xs text-faint mb-2">Why?</h2>
    <div id="indicatorList" class="border border-border rounded-lg divide-y divide-border"></div>
  </section>

  <section id="aiSection" class="mb-6 hidden">
    <h2 class="text-xs text-faint mb-2">AI interpretation <span class="text-faint">— separate from calculated evidence above</span></h2>
    <div class="border border-accent-30 bg-accent-soft rounded-lg p-4 text-sm space-y-2" id="aiContent"></div>
  </section>

  <section>
    <h2 class="text-xs text-faint mb-2">Performance (resolved outcomes)</h2>
    <div id="perfList" class="border border-border rounded-lg divide-y divide-border">
      <div class="px-4 py-4 text-sm text-faint">Loading…</div>
    </div>
  </section>

</div>

<script src="app.js"></script>
<script>
renderNav(null); // asset detail isn't a top-level nav item; keep the bar for consistent wayfinding
(async function () {
  const params = new URLSearchParams(location.search);
  const asset = (params.get('asset') || 'BTC').toUpperCase();
  document.getElementById('assetTitle').textContent = asset;

  const dirColor = (d) => d === 'BULLISH' ? 'text-up' : d === 'BEARISH' ? 'text-down' : 'text-muted';
  const stateColor = (d) => d === 'BULLISH' ? 'text-up' : d === 'BEARISH' ? 'text-down' : 'text-faint';

  // --- Signal + Why panel ---
  try {
    const detail = await v4Fetch(`/api/assets/${asset}`);
    const s = detail.signal;

    document.getElementById('assetPrice').textContent = `Last evaluated ${new Date(s.ts).toLocaleString()}`;

    document.getElementById('signalSection').innerHTML = `
      <div class="flex items-baseline justify-between mb-3">
        <span class="${dirColor(s.direction)} font-mono text-2xl font-semibold">${s.direction} ${s.score >= 0 ? '+' : ''}${s.score}</span>
        <span class="text-xs font-mono ${s.risk === 'LOW' ? 'text-up' : s.risk === 'HIGH' ? 'text-down' : 'text-warn'}">${s.risk} risk</span>
      </div>
      <div class="grid grid-cols-2 gap-3 text-sm">
        <div><span class="text-faint block text-xs">Evidence</span>${escapeHtml(s.evidence_label)}</div>
        <div><span class="text-faint block text-xs">Regime</span>${s.regime.replaceAll('_', ' ')}</div>
        <div><span class="text-faint block text-xs">Persistence</span>${s.persistence_count} consecutive evaluation${s.persistence_count === 1 ? '' : 's'}</div>
        <div><span class="text-faint block text-xs">Stability</span><span class="${s.stability === 'UNSTABLE' ? 'text-warn' : 'text-up'}">${s.stability}</span></div>
      </div>`;

    document.getElementById('indicatorList').innerHTML = detail.indicators
      .sort((a, b) => a.indicator.localeCompare(b.indicator))
      .map((i) => `
        <div class="px-4 py-3 flex items-center justify-between gap-4">
          <span class="font-mono text-sm w-20 shrink-0">${i.indicator}</span>
          <span class="text-xs text-muted flex-1">${escapeHtml(i.interpretation || 'Insufficient history')}</span>
          <span class="${stateColor(i.direction)} text-xs font-mono shrink-0">${i.applicable ? i.direction : '—'}</span>
        </div>`).join('');

    if (detail.explanation) {
      const supports = JSON.parse(detail.explanation.supports || '[]');
      const contradicts = JSON.parse(detail.explanation.contradicts || '[]');
      const risks = JSON.parse(detail.explanation.risks || '[]');
      document.getElementById('aiSection').classList.remove('hidden');
      document.getElementById('aiContent').innerHTML = `
        ${supports.length ? `<p><span class="text-up">Supports:</span> ${escapeHtml(supports.join(' '))}</p>` : ''}
        ${contradicts.length ? `<p><span class="text-down">Contradicts:</span> ${escapeHtml(contradicts.join(' '))}</p>` : ''}
        ${risks.length ? `<p><span class="text-warn">Risks:</span> ${escapeHtml(risks.join(' '))}</p>` : ''}
        ${detail.explanation.invalidation ? `<p><span class="text-muted">Would invalidate if:</span> ${escapeHtml(detail.explanation.invalidation)}</p>` : ''}
        <p class="text-xs text-faint pt-1">Model: ${escapeHtml(detail.explanation.model)}</p>`;
    }
  } catch (err) {
    document.getElementById('signalSection').innerHTML = `<p class="text-sm text-down">Could not load signal: ${escapeHtml(err.message)}</p>`;
  }

  // --- Chart with range buttons ---
  const ranges = ['12h', '24h', '7d', '30d'];
  let activeRange = '7d';
  const rangeBtnEl = document.getElementById('rangeButtons');
  const chartEl = document.getElementById('chartContainer');

  function renderRangeButtons() {
    rangeBtnEl.innerHTML = ranges.map((r) =>
      `<button data-range="${r}" class="text-xs px-2 py-1 rounded-md border ${r === activeRange ? 'border-accent-30 bg-accent-soft text-accent' : 'border-border text-faint hover-text-muted'}">${r}</button>`
    ).join('');
    rangeBtnEl.querySelectorAll('button').forEach((btn) => {
      btn.addEventListener('click', () => { activeRange = btn.dataset.range; renderRangeButtons(); loadChart(); });
    });
  }

  async function loadChart() {
    chartEl.innerHTML = '<div class="px-4 py-10 text-center text-sm text-faint">Loading chart…</div>';
    try {
      const { points } = await v4Fetch(`/api/assets/${asset}/history?range=${activeRange}`);
      renderPriceSignalChart(chartEl, points);
    } catch (err) {
      chartEl.innerHTML = `<div class="px-4 py-6 text-sm text-down">${escapeHtml(err.message)}</div>`;
    }
  }

  renderRangeButtons();
  loadChart();

  // --- Performance ---
  try {
    const perf = await v4Fetch(`/api/assets/${asset}/performance`);
    const rows = perf.performance.filter((r) => r.regime === 'ALL');
    document.getElementById('perfList').innerHTML = rows.length ? rows.map((r) => `
      <div class="px-4 py-3 flex items-center justify-between">
        <span class="font-mono text-sm">${r.horizon}</span>
        ${r.status === 'OK'
          ? `<span class="text-sm">${fmtPct(r.win_rate)} win rate <span class="text-faint">(${r.samples} resolved)</span></span>`
          : `<span class="text-sm text-faint">Insufficient evidence — ${r.samples} resolved observation${r.samples === 1 ? '' : 's'}</span>`}
      </div>`).join('') : '<div class="px-4 py-4 text-sm text-faint">No horizons evaluated yet.</div>';
  } catch (err) {
    document.getElementById('perfList').innerHTML = `<div class="px-4 py-4 text-sm text-down">${escapeHtml(err.message)}</div>`;
  }
})();
</script>
</body>
</html>
