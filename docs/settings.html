<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CryptoPulse V4 — Settings</title>
<script>
  (function () {
    var saved = localStorage.getItem('v4-theme');
    var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="theme.css?v=4.0.1" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['"IBM Plex Mono"', 'monospace'] } } } };
</script>
</head>
<body class="bg-base text-ink font-sans min-h-screen">
<div class="max-w-3xl mx-auto px-4 sm:px-6 py-8">
  <div class="flex items-center justify-between mb-3">
    <a href="index.html" class="text-xs text-faint hover-text-muted font-mono">&larr; Dashboard</a>
    <button class="theme-toggle" aria-label="Toggle theme" title="Toggle light/dark theme">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
    </button>
  </div>
  <nav id="siteNav" class="flex items-center gap-1 mb-4 overflow-x-auto"></nav>
  <h1 class="font-mono font-semibold text-lg mb-6 pb-4 border-b border-border">Settings</h1>

  <!-- API URL Override -->
  <section class="mb-6 bg-surface border border-border rounded-lg p-4">
    <h2 class="text-xs font-mono text-faint uppercase tracking-wider mb-2">V4 Worker API Base URL</h2>
    <p class="text-xs text-faint mb-3 font-mono">Set an override if pointing at a custom domain or local development Worker.</p>
    <div class="flex gap-2">
      <input id="apiBaseInput" type="text" class="flex-1 bg-elevated border border-border rounded px-3 py-1.5 text-xs font-mono text-ink focus:outline-none focus:border-accent" placeholder="https://cryptopulse-v4.quiquandon.workers.dev">
      <button id="saveApiBase" class="text-xs font-mono px-3 py-1.5 rounded bg-accent-soft text-accent border border-accent-30 hover-bg-surface">Save</button>
      <button id="resetApiBase" class="text-xs font-mono px-3 py-1.5 rounded border border-border text-faint hover-bg-elevated">Reset</button>
    </div>
    <p id="apiBaseStatus" class="text-xs font-mono text-faint mt-2"></p>
  </section>

  <!-- Import Bearer Token -->
  <section class="bg-surface border border-border rounded-lg p-4">
    <h2 class="text-xs font-mono text-faint uppercase tracking-wider mb-2">Portfolio Import Token</h2>
    <p class="text-xs text-faint mb-3 font-mono">Stored in your browser's local storage to authenticate statement uploads against POST /api/portfolio/import.</p>
    <div class="flex gap-2">
      <input id="tokenInput" type="password" class="flex-1 bg-elevated border border-border rounded px-3 py-1.5 text-xs font-mono text-ink focus:outline-none focus:border-accent" placeholder="INGEST_TOKEN secret">
      <button id="saveToken" class="text-xs font-mono px-3 py-1.5 rounded bg-accent-soft text-accent border border-accent-30 hover-bg-surface">Save</button>
      <button id="clearToken" class="text-xs font-mono px-3 py-1.5 rounded border border-border text-faint hover-bg-elevated">Clear</button>
    </div>
    <p id="tokenStatus" class="text-xs font-mono text-faint mt-2"></p>
  </section>
</div>

<script src="app.js?v=4.0.1"></script>
<script>
renderNav('settings.html');

const apiInput = document.getElementById('apiBaseInput');
apiInput.value = localStorage.getItem('v4-api-base-override') || window.V4_API_BASE;

document.getElementById('saveApiBase').addEventListener('click', () => {
  const val = apiInput.value.trim().replace(/\/+$/, '');
  if (!val) { localStorage.removeItem('v4-api-base-override'); }
  else { localStorage.setItem('v4-api-base-override', val); }
  document.getElementById('apiBaseStatus').textContent = 'Saved API base URL. Reloading page...';
  setTimeout(() => location.reload(), 500);
});

document.getElementById('resetApiBase').addEventListener('click', () => {
  localStorage.removeItem('v4-api-base-override');
  apiInput.value = 'https://cryptopulse-v4.quiquandon.workers.dev';
  document.getElementById('apiBaseStatus').textContent = 'Reset to default URL. Reloading page...';
  setTimeout(() => location.reload(), 500);
});

const tokenInput = document.getElementById('tokenInput');
tokenInput.value = localStorage.getItem('v4-import-token') || '';

document.getElementById('saveToken').addEventListener('click', () => {
  const val = tokenInput.value.trim();
  if (val) { localStorage.setItem('v4-import-token', val); document.getElementById('tokenStatus').textContent = 'Import token saved.'; }
  else { localStorage.removeItem('v4-import-token'); document.getElementById('tokenStatus').textContent = 'Cleared import token.'; }
});

document.getElementById('clearToken').addEventListener('click', () => {
  localStorage.removeItem('v4-import-token');
  tokenInput.value = '';
  document.getElementById('tokenStatus').textContent = 'Import token cleared.';
});
</script>
</body>
</html>
