<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CryptoPulse V4 — System & Data Health Telemetry</title>
<script>
  (function () {
    var saved = localStorage.getItem('v4-theme');
    var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="theme.css?v=4.0.1" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['"IBM Plex Mono"', 'monospace'] } } } };
</script>
</head>
<body class="bg-base text-ink font-sans min-h-screen">
<div class="max-w-4xl mx-auto px-4 sm:px-6 py-8">

  <div class="flex items-center justify-between mb-3">
    <a href="index.html" class="text-xs text-faint hover-text-muted font-mono">&larr; Dashboard</a>
    <button class="theme-toggle" aria-label="Toggle theme" title="Toggle light/dark theme">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
    </button>
  </div>

  <nav id="siteNav" class="flex items-center gap-1 mb-4 overflow-x-auto"></nav>

  <header class="mb-6 pb-4 border-b border-border flex items-baseline justify-between">
    <div>
      <h1 class="font-mono font-semibold text-xl tracking-tight mb-1">System &amp; Data Health</h1>
      <p class="text-xs text-faint font-mono">Real-time system telemetry and portfolio coverage health.</p>
    </div>
    <div id="overallBadge" class="font-mono text-xs px-2.5 py-1 rounded border border-border bg-surface">
      Loading...
    </div>
  </header>

  <!-- Portfolio Data Health -->
  <section class="mb-6 bg-surface border border-border rounded-lg overflow-hidden">
    <div class="px-4 py-3 bg-elevated border-b border-border flex items-center justify-between">
      <h2 class="text-xs font-mono text-faint uppercase tracking-wider">Portfolio Historical Data Health</h2>
      <span class="text-[10px] font-mono text-faint">Verified Records</span>
    </div>
    <div id="portfolioHealth" class="divide-y divide-border">
      <div class="px-4 py-4 text-sm font-mono text-faint">Loading portfolio data health…</div>
    </div>
  </section>

  <!-- Market Data & Engine Component Telemetry -->
  <section class="bg-surface border border-border rounded-lg overflow-hidden">
    <div class="px-4 py-3 bg-elevated border-b border-border flex items-center justify-between">
      <h2 class="text-xs font-mono text-faint uppercase tracking-wider">Market Ingestion &amp; Component Telemetry</h2>
      <span class="text-[10px] font-mono text-faint">Live Telemetry</span>
    </div>
    <div id="healthList" class="divide-y divide-border">
      <div class="px-4 py-4 text-sm font-mono text-faint">Loading telemetry…</div>
    </div>
  </section>

</div>

<script src="app.js?v=4.0.1"></script>
<script>
renderNav('health.html');

(async function () {
  try {
    const h = await v4Fetch('/api/portfolio/data-health');
    const el = document.getElementById('portfolioHealth');
    if (!h.transactions?.n) {
      el.innerHTML = '<div class="px-4 py-4 text-sm font-mono text-faint">No portfolio transactions recorded.</div>';
    } else {
      const fmt = (ts) => new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
      el.innerHTML = `
        <div class="px-4 py-3 flex justify-between text-xs font-mono"><span class="text-faint">Earliest Verified Portfolio Record</span><span class="font-medium">${fmt(h.transactions.earliest)}</span></div>
        <div class="px-4 py-3 flex justify-between text-xs font-mono"><span class="text-faint">Latest Verified Portfolio Record</span><span class="font-medium">${fmt(h.transactions.latest)}</span></div>
        <div class="px-4 py-3 flex justify-between text-xs font-mono"><span class="text-faint">Total Transactions Recorded</span><span class="font-medium">${h.transactions.n}</span></div>
        <div class="px-4 py-3 flex justify-between text-xs font-mono"><span class="text-faint">Total Equity Snapshots Computed</span><span class="font-medium">${h.snapshots.n ?? 0}</span></div>
        ${h.bySource.map((s) => `<div class="px-4 py-3 flex justify-between text-xs font-mono"><span class="text-faint">Source: ${escapeHtml(s.source)}</span><span>${s.n} txs (${fmt(s.earliest)} \u2192 ${fmt(s.latest)})</span></div>`).join('')}`;
    }
  } catch (err) {
    document.getElementById('portfolioHealth').innerHTML = `<div class="px-4 py-4 text-sm font-mono text-down">${escapeHtml(err.message)}</div>`;
  }
})();

(async function () {
  const stateClass = {
    LIVE: 'badge-up', OK: 'badge-up',
    RECENT: 'badge-warn', STALE: 'badge-warn',
    UNAVAILABLE: 'badge-down', ERROR: 'badge-down'
  };
  try {
    const health = await v4Fetch('/api/health');
    const badge = document.getElementById('overallBadge');
    badge.textContent = `SYSTEM: ${health.overall}`;
    badge.className = `font-mono text-xs px-2.5 py-1 rounded border ${health.overall === 'LIVE' || health.overall === 'OK' ? 'badge-up' : 'badge-warn'}`;

    const rows = health.detail || [];
    document.getElementById('healthList').innerHTML = rows.length ? rows.map((r) => `
      <div class="px-4 py-3 flex items-center justify-between gap-4 font-mono text-xs">
        <span class="font-medium w-48 shrink-0">${escapeHtml(r.component)}</span>
        <span class="text-faint flex-1 text-right truncate">${escapeHtml(r.detail || '')}</span>
        <span class="badge ${stateClass[r.status] || 'badge-faint'} shrink-0">${r.status}</span>
      </div>`).join('') : '<div class="px-4 py-4 text-sm font-mono text-faint">No telemetry recorded yet.</div>';
  } catch (err) {
    document.getElementById('healthList').innerHTML = `<div class="px-4 py-4 text-sm font-mono text-down">Could not reach the V4 API: ${escapeHtml(err.message)}</div>`;
  }
})();
</script>
</body>
</html>
