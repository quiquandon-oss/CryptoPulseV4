<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CryptoPulse V4 — Data Health</title>
<script>
  (function () {
    var saved = localStorage.getItem('v4-theme');
    var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="theme.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['"IBM Plex Mono"', 'monospace'] } } } };
</script>
</head>
<body class="bg-base text-ink font-sans min-h-screen">
<div class="max-w-3xl mx-auto px-4 sm:px-6 py-8">
  <div class="flex items-center justify-between mb-3">
    <a href="index.html" class="text-xs text-faint hover-text-muted">&larr; Market overview</a>
    <button class="theme-toggle" aria-label="Toggle theme" title="Toggle light/dark theme">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
    </button>
  </div>
  <nav id="siteNav" class="flex items-center gap-1 mb-4 overflow-x-auto"></nav>
  <h1 class="font-mono font-semibold text-lg mb-6 pb-4 border-b border-border">Data health</h1>

  <section class="mb-6">
    <h2 class="text-xs text-faint mb-2">Portfolio history</h2>
    <div id="portfolioHealth" class="border border-border rounded-lg divide-y divide-border">
      <div class="px-4 py-4 text-sm text-faint">Loading…</div>
    </div>
  </section>

  <h2 class="text-xs text-faint mb-2">Market data &amp; system</h2>
  <div id="healthList" class="border border-border rounded-lg divide-y divide-border">
    <div class="px-4 py-4 text-sm text-faint">Loading…</div>
  </div>
</div>

<script src="app.js"></script>
<script>
renderNav('health.html');
(async function () {
  try {
    const h = await v4Fetch('/api/portfolio/data-health');
    const el = document.getElementById('portfolioHealth');
    if (!h.transactions?.n) {
      el.innerHTML = '<div class="px-4 py-4 text-sm text-faint">No portfolio data imported yet.</div>';
    } else {
      const fmt = (ts) => new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
      el.innerHTML = `
        <div class="px-4 py-3 flex justify-between text-sm"><span class="text-faint">Earliest data</span><span class="font-mono">${fmt(h.transactions.earliest)}</span></div>
        <div class="px-4 py-3 flex justify-between text-sm"><span class="text-faint">Latest data</span><span class="font-mono">${fmt(h.transactions.latest)}</span></div>
        <div class="px-4 py-3 flex justify-between text-sm"><span class="text-faint">Transactions</span><span class="font-mono">${h.transactions.n}</span></div>
        <div class="px-4 py-3 flex justify-between text-sm"><span class="text-faint">Snapshots recorded</span><span class="font-mono">${h.snapshots.n ?? 0}</span></div>
        ${h.bySource.map((s) => `<div class="px-4 py-3 flex justify-between text-sm"><span class="text-faint">${escapeHtml(s.source)}</span><span class="font-mono text-xs">${s.n} txs, ${fmt(s.earliest)} \u2192 ${fmt(s.latest)}</span></div>`).join('')}
        <div class="px-4 py-3 flex justify-between text-sm"><span class="text-faint">Status</span><span class="text-up font-mono">LIVE (import-derived, not independently verified against source statements)</span></div>`;
    }
  } catch (err) {
    document.getElementById('portfolioHealth').innerHTML = `<div class="px-4 py-4 text-sm text-down">${escapeHtml(err.message)}</div>`;
  }
})();
</script>
<script>
(async function () {
  const stateColor = { LIVE: 'text-up', OK: 'text-up', RECENT: 'text-warn', STALE: 'text-warn', UNAVAILABLE: 'text-down', ERROR: 'text-down' };
  try {
    const health = await v4Fetch('/api/health');
    const rows = health.detail || [];
    document.getElementById('healthList').innerHTML = rows.length ? rows.map((r) => `
      <div class="px-4 py-3 flex items-center justify-between gap-4">
        <span class="font-mono text-sm">${escapeHtml(r.component)}</span>
        <span class="text-xs text-faint flex-1 text-right px-3">${escapeHtml(r.detail || '')}</span>
        <span class="${stateColor[r.status] || 'text-faint'} text-xs font-mono shrink-0">${r.status}</span>
      </div>`).join('') : '<div class="px-4 py-4 text-sm text-faint">No health data recorded yet — waiting for the first ingest cycle.</div>';
  } catch (err) {
    document.getElementById('healthList').innerHTML = `<div class="px-4 py-4 text-sm text-down">Could not reach the V4 API: ${escapeHtml(err.message)}</div>`;
  }
})();
</script>
</body>
</html>
