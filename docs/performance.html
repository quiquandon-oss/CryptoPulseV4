<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CryptoPulse V4 — Performance</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48x48.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<script>
  (function () {
    var saved = localStorage.getItem('v4-theme');
    var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="theme.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['"IBM Plex Mono"', 'monospace'] } } } };
</script>
</head>
<body class="bg-base text-ink font-sans min-h-screen">
<div class="max-w-3xl mx-auto px-4 sm:px-6 py-4 sm:py-8">

  <div class="flex items-center justify-between mb-3">
    <a href="index.html" class="text-xs text-faint hover-text-muted font-mono">&larr; Dashboard</a>
    <button class="theme-toggle touch-target" aria-label="Toggle theme" title="Toggle light/dark theme">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
    </button>
  </div>

  <nav id="siteNav" class="mb-4"></nav>

  <h1 class="font-mono font-semibold text-xl tracking-tight mb-1 text-ink">Performance</h1>
  <p class="text-xs text-faint font-mono mb-6 pb-4 border-b border-border">Portfolio value trend and signal engine accuracy telemetry.</p>

  <!-- MOBILE FULL-WIDTH PORTFOLIO PERFORMANCE CARD -->
  <section class="mb-6 glossy-card rounded-2xl p-4 sm:p-5 space-y-4">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-border">
      <div>
        <h2 class="text-sm font-sans font-semibold text-ink">Portfolio Value Chart</h2>
        <p class="text-[11px] font-sans text-faint">Equity curve &amp; capital allocation</p>
      </div>
      <!-- Period Selector -->
      <div class="flex items-center gap-2">
        <div id="perfPeriodSelector" class="flex gap-1 overflow-x-auto no-scrollbar py-0.5"></div>
        <div id="perfValueChartExpand"></div>
      </div>
    </div>

    <!-- Chart Container -->
    <div id="perfValueChart" class="min-h-[160px]">
      <div class="chart-skeleton w-full" style="height:220px"></div>
    </div>

    <!-- Stats Below Chart: Best Asset, Worst Asset, Transaction Count -->
    <div class="grid grid-cols-3 gap-2 pt-3 border-t border-border text-center font-mono">
      <div class="bg-elevated p-2 rounded border border-border">
        <span class="text-[10px] text-faint uppercase block">Best Asset</span>
        <span id="bestAssetSym" class="text-xs sm:text-sm font-semibold text-up block">—</span>
        <span id="bestAssetPct" class="text-[10px] text-up block"></span>
      </div>
      <div class="bg-elevated p-2 rounded border border-border">
        <span class="text-[10px] text-faint uppercase block">Worst Asset</span>
        <span id="worstAssetSym" class="text-xs sm:text-sm font-semibold text-down block">—</span>
        <span id="worstAssetPct" class="text-[10px] text-down block"></span>
      </div>
      <div class="bg-elevated p-2 rounded border border-border">
        <span class="text-[10px] text-faint uppercase block">Transactions</span>
        <span id="txCountVal" class="text-xs sm:text-sm font-semibold text-ink block">—</span>
      </div>
    </div>
  </section>

  <!-- SIGNAL ENGINE PERFORMANCE SECTION -->
  <section class="mb-6 space-y-4">
    <div class="flex items-center justify-between">
      <h2 class="text-xs font-mono uppercase tracking-wider text-faint font-semibold">Signal Engine Performance</h2>
      <a href="audit.html" class="text-xs font-mono text-accent hover:underline">Audit Logs &rarr;</a>
    </div>

    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
      <select id="fAsset" class="bg-surface border border-border rounded-lg text-xs font-mono p-2 text-ink focus:outline-none focus:border-accent">
        <option value="">All assets</option>
        <option value="BTC">BTC</option>
        <option value="ETH">ETH</option>
        <option value="LINK">LINK</option>
      </select>
      <select id="fHorizon" class="bg-surface border border-border rounded-lg text-xs font-mono p-2 text-ink focus:outline-none focus:border-accent">
        <option value="">All horizons</option>
        <option value="12h">12h</option>
        <option value="24h">24h</option>
      </select>
      <select id="fRegime" class="bg-surface border border-border rounded-lg text-xs font-mono p-2 text-ink focus:outline-none focus:border-accent col-span-2 sm:col-span-1">
        <option value="">All regimes</option>
        <option value="ALL">Aggregate (ALL)</option>
        <option value="TRENDING_BULLISH">Trending bullish</option>
        <option value="TRENDING_BEARISH">Trending bearish</option>
        <option value="RANGE_BOUND">Range bound</option>
        <option value="HIGH_VOLATILITY">High volatility</option>
        <option value="LOW_VOLATILITY">Low volatility</option>
        <option value="TRANSITION">Transition</option>
        <option value="UNKNOWN">Unknown</option>
      </select>
      <input id="fSince" type="date" class="bg-surface border border-border rounded-lg text-xs font-mono p-2 text-ink focus:outline-none focus:border-accent" title="Resolved on/after this date">
    </div>

    <div id="results" class="bg-surface border border-border rounded-xl divide-y divide-border overflow-hidden">
      <div class="px-4 py-6 text-xs font-mono text-faint">Loading signal accuracy telemetry…</div>
    </div>
  </section>

</div>

<script src="app.js?v=2026091211"></script>
<script>
renderNav('performance.html');

// Period selector state
const ranges = ['1W', '1M', '3M', '6M', '1Y', 'ALL'];
let activeRange = 'ALL';

function renderPeriodSelector() {
  renderRangeButtons('perfPeriodSelector', ranges, activeRange, (r) => { activeRange = r; renderPeriodSelector(); loadPortfolioValueChart(); });
}

async function loadPortfolioValueChart() {
  const chartEl = document.getElementById('perfValueChart');
  try {
    const { points } = await v4Fetch(`/api/portfolio/history?range=${activeRange}`);
    renderPortfolioValueChart(chartEl, points);
    addFullscreenButtonWithRange('perfValueChartExpand', 'Portfolio Value Chart', ranges, () => activeRange, async (range, el) => {
      const { points: fsPoints } = await v4Fetch(`/api/portfolio/history?range=${range}`);
      renderPortfolioValueChart(el, fsPoints);
    });
  } catch (err) {
    renderDataState(chartEl, 'ERROR', err.message);
  }
}

async function loadPortfolioStats() {
  const bestSymEl = document.getElementById('bestAssetSym');
  const bestPctEl = document.getElementById('bestAssetPct');
  const worstSymEl = document.getElementById('worstAssetSym');
  const worstPctEl = document.getElementById('worstAssetPct');
  const txEl = document.getElementById('txCountVal');

  try {
    const [{ assets }, health] = await Promise.all([
      v4Fetch('/api/portfolio/assets').catch(() => ({ assets: [] })),
      v4Fetch('/api/portfolio/data-health').catch(() => ({ transactions: { n: 0 } })),
    ]);

    if (health?.transactions?.n != null) {
      txEl.textContent = health.transactions.n.toLocaleString();
    } else {
      txEl.textContent = '—';
    }

    const validAssets = (assets || []).filter((a) => a.pnlPct != null);
    if (validAssets.length) {
      const sorted = [...validAssets].sort((a, b) => b.pnlPct - a.pnlPct);
      const best = sorted[0];
      const worst = sorted[sorted.length - 1];

      bestSymEl.textContent = best.asset;
      bestPctEl.textContent = fmtPct(best.pnlPct);
      worstSymEl.textContent = worst.asset;
      worstPctEl.textContent = fmtPct(worst.pnlPct);
    } else {
      bestSymEl.textContent = '—'; bestPctEl.textContent = '';
      worstSymEl.textContent = '—'; worstPctEl.textContent = '';
    }
  } catch {
    bestSymEl.textContent = '—'; bestPctEl.textContent = '';
    worstSymEl.textContent = '—'; worstPctEl.textContent = '';
    txEl.textContent = '—';
  }
}

const el = {
  asset: document.getElementById('fAsset'),
  horizon: document.getElementById('fHorizon'),
  regime: document.getElementById('fRegime'),
  since: document.getElementById('fSince'),
  results: document.getElementById('results')
};

function regimeLabel(r) { return r ? r.replaceAll('_', ' ') : '—'; }

async function loadSignalPerformance() {
  el.results.innerHTML = '<div class="px-4 py-6 text-xs font-mono text-faint">Loading signal accuracy telemetry…</div>';
  const qs = new URLSearchParams();
  if (el.asset.value) qs.set('asset', el.asset.value);
  if (el.horizon.value) qs.set('horizon', el.horizon.value);
  if (el.regime.value) qs.set('regime', el.regime.value);
  if (el.since.value) qs.set('since', el.since.value);

  try {
    const { performance } = await v4Fetch(`/api/performance?${qs.toString()}`);
    if (!performance || !performance.length) {
      el.results.innerHTML = '<div class="px-4 py-6 text-xs font-mono text-faint">No matching performance observations recorded.</div>';
      return;
    }
    el.results.innerHTML = performance.map((r) => `
      <div class="px-4 py-3 font-mono">
        <div class="flex items-center justify-between mb-1">
          <span class="text-xs font-semibold text-ink">${r.asset_id || 'All assets'} · ${r.horizon || 'all horizons'}</span>
          <span class="text-[10px] text-faint uppercase">${regimeLabel(r.regime)}${r.ad_hoc ? ' · live' : ''}</span>
        </div>
        ${r.status === 'OK' ? `
          <div class="grid grid-cols-3 gap-2 text-xs mt-2 bg-elevated p-2 rounded border border-border">
            <div><span class="block text-[10px] text-faint uppercase">Win Rate</span><span class="text-ink font-semibold">${fmtPct(r.win_rate)}</span></div>
            <div><span class="block text-[10px] text-faint uppercase">Avg Return</span><span class="${r.avg_return >= 0 ? 'text-up' : 'text-down'} font-semibold">${fmtPct(r.avg_return)}</span></div>
            <div><span class="block text-[10px] text-faint uppercase">Samples</span><span class="text-ink font-semibold">${r.samples}</span></div>
          </div>` : `<p class="text-xs text-faint mt-1">Insufficient evidence — ${r.samples} resolved observation${r.samples === 1 ? '' : 's'}. (Min 20 required)</p>`}
      </div>`).join('');
  } catch (err) {
    el.results.innerHTML = `<div class="px-4 py-6 text-xs font-mono text-down">${escapeHtml(err.message)}</div>`;
  }
}

[el.asset, el.horizon, el.regime, el.since].forEach((input) => input.addEventListener('change', loadSignalPerformance));

renderPeriodSelector();
loadPortfolioValueChart();
loadPortfolioStats();
loadSignalPerformance();
</script>
</body>
</html>
