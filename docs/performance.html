<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CryptoPulse V4 — Performance</title>
<script>
  (function () {
    var saved = localStorage.getItem('v4-theme');
    var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="theme.css?v=4.0.1" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['"IBM Plex Mono"', 'monospace'] } } } };
</script>
</head>
<body class="bg-base text-ink font-sans min-h-screen">
<div class="max-w-3xl mx-auto px-4 sm:px-6 py-8">
  <div class="flex items-center justify-between mb-3">
    <a href="index.html" class="text-xs text-faint hover-text-muted font-mono">&larr; Dashboard</a>
    <button class="theme-toggle" aria-label="Toggle theme" title="Toggle light/dark theme">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
    </button>
  </div>
  <nav id="siteNav" class="flex items-center gap-1 mb-4 overflow-x-auto"></nav>
  <h1 class="font-mono font-semibold text-lg mb-1">Model Signal Performance</h1>
  <p class="text-xs text-faint mb-6 pb-4 border-b border-border font-mono">Gated on resolved signal outcomes across 12h and 24h evaluation horizons.</p>

  <div id="perfList" class="bg-surface border border-border rounded-lg divide-y divide-border overflow-hidden">
    <div class="px-4 py-6 text-sm text-faint font-mono">Loading signal performance metrics…</div>
  </div>
</div>

<script src="app.js?v=4.0.1"></script>
<script>
renderNav('performance.html');
(async function () {
  const el = document.getElementById('perfList');
  try {
    const { performance } = await v4Fetch('/api/performance');
    if (!performance.length) { el.innerHTML = '<div class="px-4 py-6 text-sm text-faint font-mono">No performance records computed.</div>'; return; }
    el.innerHTML = performance.map((r) => `
      <div class="px-4 py-3.5 flex items-center justify-between gap-4 font-mono text-xs">
        <span class="font-medium">${r.asset_id || 'GLOBAL'} / ${r.horizon} <span class="text-faint">(${r.regime})</span></span>
        ${r.status === 'OK'
          ? `<span>${fmtPct(r.win_rate)} win rate <span class="text-faint">(${r.samples} samples)</span></span>`
          : `<span class="text-faint">INSUFFICIENT_DATA (${r.samples} sample${r.samples === 1 ? '' : 's'})</span>`}
      </div>`).join('');
  } catch (err) {
    el.innerHTML = `<div class="px-4 py-6 text-sm text-down font-mono">${escapeHtml(err.message)}</div>`;
  }
})();
</script>
</body>
</html>
