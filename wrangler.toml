name = "cryptopulse-v4"
main = "worker/index.js"
compatibility_date = "2026-09-01"
account_id = "f58e761fbc8e62dc404d8684290af264"

# Deliberately no [triggers] block: this Cloudflare account's 5 Free-tier Cron
# Trigger slots are already used by V1 (3) and V2 (2). Ingestion is instead
# driven externally by .github/workflows/ingest.yml calling POST /api/ingest.
# See docs/ARCHITECTURE.md "Scheduling" section.

[[d1_databases]]
binding = "DB"
database_name = "cryptopulse-v4"
database_id = "5faaf930-ea76-41d3-bef2-df630ff11875"

# Second binding to V1's own physical D1 database (same database V1's own
# Worker uses) — for the Market Pulse import job ONLY. This is a direct D1
# binding, not an HTTP call to V1's Worker: V4 stays operational even if
# V1's Worker were deleted entirely, as long as this D1 database still
# exists. Read ONLY by worker/market_pulse.js's periodic import (triggered
# by the ingest cron, never by a user-facing request handler) — the Market
# Pulse UI and API always read from V4's own imported_v1_history table
# (migration 0005), never this binding directly. See docs/ARCHITECTURE.md
# "V1 independence" section.
[[d1_databases]]
binding = "V1_DB"
database_name = "sentiment-history"
database_id = "f91ca980-b886-423a-bd6f-f3baea46d181"

# Secrets (never committed): set with
#   wrangler secret put INGEST_TOKEN
#   wrangler secret put GEMINI_API_KEY   (optional — omit to use the deterministic explanation fallback)
