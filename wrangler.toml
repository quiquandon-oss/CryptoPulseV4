name = "cryptopulse-v4"
main = "worker/index.js"
compatibility_date = "2026-09-01"
account_id = "f58e761fbc8e62dc404d8684290af264"

# Deliberately no [triggers] block: this Cloudflare account's 5 Free-tier Cron
# Trigger slots are already used by V1 (3) and V2 (2). Ingestion is instead
# driven externally by .github/workflows/ingest.yml calling POST /api/ingest.
# See docs/ARCHITECTURE.md "Scheduling" section.

[[d1_databases]]
binding = "DB"
database_name = "cryptopulse-v4"
database_id = "5faaf930-ea76-41d3-bef2-df630ff11875"

# Second binding to V1/V2's shared physical D1 database (same database both
# their own Workers use) — used by the Market Pulse import job AND the
# short-term prediction funnel feature (V2's k-NN/TimesFM prediction
# tables live here too). A direct D1 binding, not an HTTP call to either
# Worker: V4 stays operational even if V1's or V2's Worker were deleted
# entirely, as long as this D1 database still exists. Read ONLY by
# worker-side jobs, never by a user-facing request handler directly — the
# UI always reads from V4's own imported/computed tables. See
# docs/ARCHITECTURE.md "V1 independence" section.
[[d1_databases]]
binding = "V1V2_DB"
database_name = "sentiment-history"
database_id = "f91ca980-b886-423a-bd6f-f3baea46d181"

# Secrets (never committed): set with
#   wrangler secret put INGEST_TOKEN
#   wrangler secret put GEMINI_API_KEY   (optional — omit to use the deterministic explanation fallback)
